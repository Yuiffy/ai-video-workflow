:root{--bg:#07141d;--ink:#eaf5f1;--muted:#94b5b6;--cyan:#63e4cf;--gold:#f5c27b;--pink:#ff7f96;--line:#31515b}*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#deck{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--scale,1));background:radial-gradient(ellipse at 77% 45%,#16424a55,transparent 55%),var(--bg);overflow:hidden}header{position:absolute;top:54px;left:88px;right:88px;display:flex;justify-content:space-between;font-size:18px;letter-spacing:3px;color:#70999d}header b{font-weight:500;color:#eaf5f1}.slide{display:none;position:absolute;inset:0;padding:170px 88px 150px;grid-template-columns:720px 1fr;gap:90px;align-items:center}.slide.active{display:grid}.eyebrow{font-size:19px;color:var(--cyan);letter-spacing:4px;margin-bottom:24px}.counter{font:18px Consolas;color:#648990;margin-top:35px}h1{font-size:70px;line-height:1.16;letter-spacing:-3px;margin:0 0 30px;max-width:700px}h1 em{font-style:normal;color:var(--cyan)}p{font-size:27px;line-height:1.85;color:var(--muted);margin:0;max-width:700px}.source{margin-top:30px;color:#65898f;font-size:17px;line-height:1.75}.source strong{color:var(--gold);font-weight:500}.stage{height:600px;position:relative;display:flex;align-items:center;justify-content:center}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#63e4cf08 48%,transparent)}.axis{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}.packet{position:absolute;left:calc(var(--p)*1%);top:calc(50% + var(--y));width:126px;height:42px;border:1px solid #568b91;border-radius:9px;background:#102b34;display:grid;place-items:center;font-size:16px;color:#cde0dc;transform:translate(-50%,-50%) scale(var(--s,1));opacity:var(--o,1)}.packet.hot{border-color:var(--gold);color:var(--gold)}.packet.merge{width:180px;border-color:var(--cyan);color:var(--cya ex;gap:16px}.rule b{border:1px solid #4e777a;border-radius:20px;padding:10px 18px;color:var(--muted);opacity:.25}.rule b.on{opacity:1;border-color:var(--cyan);color:var(--cyan)}.script-track{position:absolute;left:7%;right:7%;top:47%;height:5px;background:var(--line)}.script-dot{position:absolute;left:calc(var(--p)*80% + 10%);top:calc(47% - 13px);width:30px;height:30px;border-radius:50%;background:var(--gold);box-shadow:0 0 35px var(--gold);transform:translateX(-50%)}.script-node{position:absolute;top:32%;padding:22px;border:1px solid #446e73;border-radius:12px;color:var(--muted);opacity:.35;transform:translateY(20px)}.script-node.on{opacity:1;transform:translateY(0);border-color:var(--cyan);color:var(--ink)}.script-node:nth-child(1){left:5%}.script-node:nth-child(2){left:34%}.script-node:nth-child(3){right:5%}.model-line{position:absolute;left:10%;right:10%;top:56%;height:3px;background:var(--line)}.model-marker{position:absolute;left:calc(10% + var(--p)*80%);top:calc(56% - 18px);width:38px;height:38px;border-radius:50%;background:var(--cyan);box-shadow:0 0 40px var(--cyan);transform:translateX(-50%)}.model-labels{position:absolute;left:8%;right:8%;top:63%;display:flex;justify-content:space-between;color:var(--muted);font-size:21px}.glyphs{position:absolute;top:25%;display:flex;gap:24px;font-size:42px;color:var(--cyan)}.glyphs span{opacity:var(--glyph,.2);transform:translateY(calc((1 - var(--glyph))*20px))}.fourgrid{position:absolute;left:8%;top:20%;width:430px;height:430px;display:grid;grid-template-columns:1fr 1fr;gap:8px;transform:translateX(calc(var(--p)*-100px)) rotate(calc(var(--p)*-3deg));opacity:calc(1 - var(--p)*.7)}.fourgrid i{background:#16444b;border:1px solid #4a7d7d;display:grid;place-items:center;color:#87c1bc;font-style:normal;font-size:19px}.film{position:absolute;right:7%;top:20%;width:470px;height:440px;border:1px solid var(--cyan);background:linear-gradient(145deg,#112d34,#081921);transform:translateX(calc((1 - var(--p))*140px));opacity:var(--film,0);padding:28px}.film:before{content:"";display:block;height:240px;background:radial-gradient(circle at 60% 35%,#6ee7d65a,transparent 20%),linear-gradient(135deg,#184d55,#0b222a);border:1px solid #4e7e83}.film span{display:block;color:var(--gold);margin-top:22px;font-size:22px}.anchor{position:absolute;left:52%;top:48%;color:var(--cyan);font-size:18px;opacity:var(--anchor,0)}.nodes{position:absolute;inset:12% 8%}.node{position:absolute;width:128px;height:70px;border:1px solid #4f7c80;border-radius:12px;display:grid;place-items:center;color:var(--muted);opacity:.5}.node.sui{left:7%;top:15%}.node.guest{right:7%;top:15%}.node.voice{left:38%;bottom:8%}.node.image{right:8%;bottom:5%}.node.on{border-color:var(--cyan);color:var(--cyan);opacity:1}.link{position:absolute;height:2px;background:var(--cyan);transform-origin:left;opacity:var(--link-o,0)}.link.one{left:23%;top:28%;width:42%;transform:rotate(20deg)}.link.two{left:50%;top:34%;width:36%;transform:rotate(65deg)}.clock{position:absolute;left:17%;top:18%;width:250px;height:250px;border:2px solid #4b747b;border-radius:50%;display:grid;place-items:center;font-size:42px;color:var(--gold)}.clock:after{content:"";position:absolute;left:50%;top:50%;height:82px;width:3px;background:var(--cyan);transform-origin:bottom;transform:translate(-50%,-100%) rotate(calc(var(--p)*720deg))}.path{position:absolute;left:48%;right:8%;top:31%;font-size:22px;color:var(--muted);line-height:3}.path b{color:var(--cyan);font-weight:500}.branch{position:absolute;left:50%;top:53%;width:42%;height:2px;background:var(--line)}.branch:after{content:"";position:absolute;right:0;top:-22px;width:70%;height:44px;border-top:2px solid var(--cyan);border-right:2px solid var(--cyan);border-radius:0 28px 0 0;opacity:var(--p)}.branch:before{content:"文字先发 → 图片补图";position:absolute;right:0;top:34px;color:var(--gold);font-size:19px;opacity:var(--p)}.queue{position:absolute;left:7%;right:7%;top:34%;display:flex;justify-content:space-between}.qitem{width:170px;height:95px;border:1px solid #426d72;border-radius:10px;display:grid;place-items:center;color:var(--muted);opacity:.5}.qitem.on{color:var(--cyan);border-color:var(--cyan);opacity:1;transform:translateY(-12px)}.qarrow{align-self:center;color:var(--gold);font-size:30px}.end-ring{width:430px;height:430px;border-radius:50%;border:1px solid var(--cyan);display:grid;place-items:center;color:var(--cyan);font-size:48px;box-shadow:0 0 0 38px #63e4cf08,0 0 100px #63e4cf18}.end-ring small{display:block;font-size:19px;color:var(--muted);text-align:center;margin-top:15px}footer{position:absolute;left:88px;right:88px;bottom:112px;display:flex;align-items:center;gap:22px;color:#72979c;font-size:17px}.rail{flex:1;display:flex;gap:8px}.rail i{height:3px;flex:1;background:#284750}.rail i.on{background:var(--cyan)}.rail i.past{background:#387177}.page{font:19px Consolas;color:var(--muted)}
</style></head><body><main id="deck"><header><b>鹿饼暖心回复发展史 · V2</b><span>从“一句晚安”到一条可靠的内容流水线</span></header></main><script>
const data=[{"id":"origin","title":"本来只是想写一句晚安","narration":"最开始，我们只是人工把弹幕贴进聊天网页。真正费心的，是让这一句晚安，既记得今晚，也真的有点温度。","kind":"flow","labels":["人工整理","GPT 网页","晚安草稿"]},{"id":"context_limit","title":"上下文装不下，怎么办","narration":"早期模型的上下文装不下整场直播。我们先按时间分组、合并重复弹幕，再降低水词权重。先解决的，是模型到底能看到什么。","kind":"context","labels":["原始弹幕","有限窗口","超出容量"]},{"id":"short_context","title":"短一点，反而更容易写好","narration":"当时我们发现，筛选后的短上下文反而更聚焦。但不能随便删：随机丢弃后来改成评分、目标行数和必留项，让关键细节留下来。","kind":"selection","labels":["随机丢弃","目标 1000 行","必留细节"]},{"id":"full_context","title":"模型变强，取舍也要重做","narration":"后来模型能力进步，我们又试着保留完整字幕和弹幕。弥月、米汀的实验流程只压缩重复排版，再用原文复核。策略也要跟着能力变。","kind":"expand","labels":["筛选输入","完整证据","原文复核"]},{"id":"warm_prompt","title":"暖心，不是多加几句夸奖","narration":"回复一度爱说含金量爆表，听起来热闹，却每晚都差不多。后来我们要求它回应具体原话、失误和现场反应。暖心，要从今晚的细节长出来。","kind":"prompt","labels":["泛泛夸奖","回应原话","具体 → 感受"]},{"id":"prompt_boundaries","title":"一句自然的话，背后也有边界","narration":"我们还反复调整称呼、字数和问候。粉丝名字不能当主播名字，嘉宾的经历不能算给房主。白天下播，也不能机械地说晚安。","kind":"rules","labels":["称呼边界","说话人边界","真实时段"]},{"id":"comic_script","title":"先当编剧，再请画师","narration":"漫画更不是把摘要扔给画图模型。先选几个有起因、有转折的节拍，再写角色动作、画面和短台词。脚本太长被截断，还得修输出限制和失败处理。","kind":"script","labels":["原文证据","叙事节拍","画面脚本"]},{"id":"references","title":"画得像，还要画得对","narration":"立绘保证人物像，录播截图保证场景对。后来脚本会主动请求关键时刻的截图，并说明用来核对什么。参考图不是装饰，而是画面证据。","kind":"references","labels":["角色立绘","关键截图","核对事实"]},{"id":"wrong_game","title":"她爱玩，不等于今晚就在玩","narration":"有次我们发现，小弥的图总在启动原神。问题出在人设抢过了本场事实。后来明确证据优先级：本场标题和原话，必须压过模型对人物的刻板印象。","kind":"evidence","labels":["稳定人设","本场标题","实际游戏"]},{"id":"image_models","title":"模型升级，中文终于能入画","narration":"早期图片里的中文容易出错，我们甚至要求纯默剧。后来接入更支持中文的模型，包括新的图像模型，才重新规划台词、拟声词和位置。","kind":"models","labels":["早期模型","高级模型","中文锚点"]},{"id":"composition","title":"同一场直播，两种讲法","narration":"构图也发展出两条路：四格把几个笑点依次讲清；沉浸式让人物进入电影感主画面。再把四到六处中文回忆锚点，放回对应动作旁边。","kind":"composition","labels":["四格分镜","沉浸主画面","回忆锚点"]},{"id":"multi_people","title":"从一个人，到一群不同的人","narration":"扩展到多位主播时，每个房间都要配置称呼、粉丝名、外观和参考图。有的人适合长回复，有的人需要短一点，语气也不能全套岁己的模板。","kind":"identity","labels":["房间配置","独立称呼","参考图"]},{"id":"false_guests","title":"一个表情包，也会让 AI 串台","narration":"表情包名字里有花礼，不代表花礼来联动了。我们修过这种误加角色，也修过把粉碎机听成岁己。声音、原话和上下文要互相核对，不能见词就替换。","kind":"gate","labels":["提到名字","证据门槛","允许入画"]},{"id":"timing","title":"生成好了，也不一定马上发","narration":"发送时机同样磨了很久：断流不等于下播，动态也要找对。新动态五分钟内优先及时回复；图片没好就先发文字，错过窗口再有限等待，之后补图。","kind":"timing","labels":["确认动态","五分钟窗口","文字先发"]},{"id":"reliability","title":"重试一次，不能多发一遍","narration":"还有观众看不见的功夫：显卡忙时排队，重启后恢复任务，同一场不能重复生图、重复评论。共享缓存省掉重复输入，失败的切片也不能拖垮整条晚安流程。","kind":"queue","labels":["排队恢复","缓存命中","一次发送"]},{"id":"ending","title":"713 次提交，还是同一个出发点","narration":"从第一版到现在，仓库已经有七百多次提交。它们不是为了把流程图画得更复杂，而是一次次让事实更准、表达更贴心，让那句晚安值得被收到。","kind":"ending","labels":["713 次提交","事实更准","心意送达"]}];const deck=document.querySelector('#deck');const slides=[];const rail=document.createElement('div');rail.className='rail';let current=0;
function visual(item){const labels=item.labels.map(function(x,i){return '<span class="token '+(i===0?'selected':'')+'" style="--dy:'+(i*3)+'px">'+x+'</span>'}).join('');if(item.kind==='flow')return '<div class="axis"></div>'+['弹幕','时间','情绪','原话'].map(function(x,i){return '<i class="packet '+(i===3?'hot':'')+'" style="--p:'+(12+i*22)+';--y:'+((i-1.5)*75)+'px">'+x+'</i>'}).join('')+'<div class="packet merge" style="--p:50;--y:0">可用输入</div>';if(item.kind==='context')return '<div class="context-box" style="--limit:68"><label><span>原始直播证据</span><span>上下文窗口</span></label><div class="bar"><div class="fill"></div></div><div class="limit"></div><div class="overflow">超出窗口 → 必须取舍</div></div>';if(item.kind==='selection')return '<div class="context-box" style="--limit:100"><label><span>评分：信号、次数、人数</span><span>目标行数</span></label><div class="bar"><div class="fill"></div></div><div class="tokens">'+labels+'</div></div>';if(item.kind==='expand')return '<div class="window"><div class="evidence"><i></i><i></i><i></i><i></i><i></i></div><div class="full-badge">完整证据 · 重复压缩</div></div>';if(item.kind==='prompt')return '<div class="badprompt">“今晚含金量爆表，大家都很开心。”<br><small>泛泛、每晚都能用</small></div><div class="goodprompt">“从本场那句原话切入，再说为什么让人心疼或发笑。”</div><div class="rule">'+labels+'</div>';if(item.kind==='rules')return '<div class="rule" style="top:35%;bottom:auto">'+labels+'</div><div class="nodes"><div class="node sui on">房主岁己</div><div class="node guest">嘉宾／外部声源</div><div class="node voice on">时段与称呼</div></div>';if(item.kind==='script')return '<div class="script-node">原文证据</div><div class="script-node">叙事节拍</div><div class="script-node">角色动作</div><div class="script-track"></div><div class="script-dot"></div>';if(item.kind==='references')return '<div class="nodes"><div class="node sui on">立绘：人物</div><div class="node guest on">截图：事实</div><div class="node voice">脚本：动作</div><div class="node image">成图：证据</div><div class="link one"></div><div class="link two"></div></div>';if(item.kind==='evidence')return '<div class="fourgrid"><i>人设<br>线索</i><i>本场<br>原话</i><i>标题<br>证据</i><i>画面<br>截图</i></div><div class="film"><div></div><span>本场事实优先</span></div>';if(item.kind==='models')return '<div class="glyphs"><span>无字</span><span>少字</span><span>中文锚点</span></div><div class="model-line"></div><div class="model-marker"></div><div class="model-labels"><span>早期模型</span><span>高级模型</span><span>GPT Image 2</span></div>';if(item.kind==='composition')return '<div class="fourgrid"><i>起因</i><i>反应</i><i>转折</i><i>结果</i></div><div class="film"><div></div><span>一张画面：起因 → 转折 → 收束</span></div><div class="anchor">文字锚点贴在对应动作旁</div>';if(item.kind==='identity')return '<div class="nodes"><div class="node sui on">岁己<br>房主</div><div class="node guest">嘉宾<br>声纹</div><div class="node voice">外观／别名</div><div class="node image">参考图</div><div class="link one"></div><div class="link two"></div></div>';if(item.kind==='gate')return '<div class="context-box"><label><span>提到名字</span><span>是否真联动？</span></label><div class="tokens">'+labels+'</div><div class="full-badge">原话 + 声音 + 上下文 → 通过</div></div>';if(item.kind==='timing')return '<div class="clock"><span>下播</span></div><div class="path"><b>确认最新动态</b><br>≤ 5 分钟：优先抢时效<br>图片未好：文字先发<br>超时后：有限等待再补图</div><div class="branch"></div>';if(item.kind==='queue')return '<div class="queue">'+['显卡忙','处理队列','缓存命中','一次发送'].map(function(x,i){return '<div class="qitem '+(i===0?'on':'')+'">'+x+'</div>'+(i<3?'<div class="qarrow">→</div>':'')}).join('')+'</div>';return '<div class="end-ring"><div>713 次提交<small>把心意稳定送达</small></div></div>'}
data.forEach(function(item,i){const s=document.createElement('section');s.className='slide'+(i===0?' active':'');s.dataset.slide=i;s.innerHTML='<div><div class="eyebrow">'+String(i+1).padStart(2,'0')+' / '+item.kind.toUpperCase()+'</div><h1>'+item.title+'</h1><p>'+item.narration+'</p><div class="source"><strong>原理图解</strong> · 动画展示关键变化，不是静态截图</div><div class="counter">AI VIDEO WORKFLOW · 2026</div></div><div class="stage" data-kind="'+item.kind+'">'+visual(item)+'</div>';deck.appendChild(s);const d=document.createElement('i');rail.appendChild(d);slides.push(s)});deck.appendChild(rail);const dots=[...rail.children];const page=document.createElement('span');page.className='page';page.id='page';const foot=document.createElement('footer');foot.innerHTML='<span>鹿饼 · 从一次回复到可靠流程</span>';foot.appendChild(rail);foot.appendChild(page);deck.appendChild(foot);
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1920,innerHeight/1080))}function select(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach(function(s,i){s.classList.toggle('active',i===current)});dots.forEach(function(d,i){d.classList.toggle('on',i===current);d.classList.toggle('past',i<current)});page.textContent=String(current+1).padStart(2,'0')+' / '+data.length}
