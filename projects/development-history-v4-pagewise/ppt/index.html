 resize(){deck.style.setProperty('--scale',Math.min(innerWidth/1920,innerHeight/1080))}let current=0;window.renderAt=({slide=0,time=0,duration=15}={})=>{current=Math.max(0,Math.min(slides.length-1,Number(slide)||0));slides.forEach((s,i)=>s.classList.toggle('active',i===current));const active=slides[current];if(active.classList.contains('overview')){const ids=['beat-input','beat-trigger','beat-stable','beat-context','beat-branch','beat-review'];const beats=active.dataset.beats.split(',').map(Number);ids.forEach((id,i)=>active.querySelector('#'+id).style.opacity=time>=beats[i]?'1':'0');const status=active.querySelector('#status');status.textContent=active.dataset.labels.split('|')[Math.max(0,beats.findLastIndex(x=>time>=x))];active.querySelector('#progress').setAttribute('d','M90 1015H'+(90+1740*Math.min(1,time/Math.max(.1,duration))));return}const beats=active.dataset.beats.split(',').map(Number);const t=Math.max(0,Number(time)||0);const groups=[...active.querySelectorAll('.phase')];groups.forEach((g,i)=>g.style.opacity=t>=beats[i]?'1':'0');const idx=Math.max(0,beats.findLastIndex(b=>t>=b));const labels=active.dataset.labels.split('|');active.querySelector('.footer-status').textContent=labels[idx];const progress=active.querySelector('.progress');progress.setAttribute('d','M90 1016H'+(90+1740*Math.min(1,t/Math.max(.1,Number(duration)||15))))};addEventListener('resize',resize);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')window.renderAt({slide:current+1,time:0,duration:15});if(e.key==='ArrowLeft')window.renderAt({slide:current-1,time:0,duration:15})});resize();window.renderAt({slide:0,time:0,duration:15})})();</script></body></html>
