<script>
const $=id=>document.getElementById(id), clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t, ease=x=>1-(1-clamp(x))**3;
const bead=(a,b,c,t)=>[(1-t)**2*a[0]+2*(1-t)*t*b[0]+t*t*c[0],(1-t)**2*a[1]+2*(1-t)*t*b[1]+t*t*c[1]];
const pose=(el,x,y,angle=0,scale=1,opacity=1)=>{el.style.transform=`translate(${x}px,${y}px) rotate(${angle}deg) scale(${scale})`;el.style.opacity=opacity};
// Deterministic texture so scrubbing and frame rendering produce identical images.
for(let i=0;i<145;i++){let x=40+((i*73+19)%348),y=50+((i*47+7)%160);if(((x-218)/177)**2+((y-130)/100)**2>1)continue;const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',4+(i%5));c.setAttribute('fill',i%3===0?'#7ba755':i%3===1?'#3e7538':'#244e2b');c.setAttribute('opacity','.65');$('floretTexture').appendChild(c)}
function renderAt({time:t=0}){
 t=clamp(t,0,5.6);let entering=1-ease((t-.55)/.38),recoil=t>=4.0&&t<4.16?Math.sin((t-4)*100)*12:0;
 pose($('sui'),recoil,entering*470,t>=1.76&&t<2.17?-3*Math.sin((t-1.76)/.41*Math.PI):0);
 const crying=t>=4.12;$('suiBack').style.opacity=crying?0:1;$('suiFront').style.opacity=crying?1:0;$('cry').style.opacity=crying?1:0;
 $('throwArm').style.opacity=t>=1.38&&t<2.60?1:0;
 $('throwArmPose').setAttribute('transform',`rotate(${-70*ease((t-1.93)/.25)} 1048 600)`);
 // Cookie, blanket and sleep expression are intentionally fixed for all frames.
 let bx=1118,by=465,br=-22,bo=t>=1.38?1:0,bs=1;
 if(t>=1.93&&t<2.18){let q=clamp((t-1.93)/.25),p=bead([1118,465],[718,25],[356,285],q);[bx,by]=p;br=lerp(-30,-390,q)}
 else if(t>=2.18&&t<2.61){let q=(t-2.18)/.43;bx=lerp(356,120,q);by=285+150*q*q;br=-390-330*q;bo=1-clamp((q-.6)/.4)}
 else if(t>=2.61)bo=0;
 pose($('bird'),bx-54,by-38,br,bs,bo);
 let gx=368,gy=625,gr=-20,go=0,gs=.60;
 $('broccoli').style.zIndex=t<3.25?'3':'10';
 if(t>=2.78&&t<3.18){let q=ease((t-2.78)/.4);gx=lerp(368,354,q);gy=lerp(625,205,q);gr=lerp(-24,-12,q);gs=lerp(.6,1.05,q);go=1}
 else if(t>=3.18&&t<3.36){gx=354;gy=205;gr=-12-14*Math.sin((t-3.18)/.18*Math.PI);gs=1.05;go=1}
 else if(t>=3.36&&t<4.02){let q=(t-3.36)/.66,p=bead([354,205],[725,0],[987,530],q);[gx,gy]=p;gr=lerp(-26,135,q);gs=1.05;go=1}
 else if(t>=4.02&&t<4.30){let q=(t-4.02)/.28;gx=lerp(987,1500,q);gy=lerp(530,-240,q);gr=135+180*q;gs=1.05;go=1-clamp((q-.75)/.25)}
 pose($('broccoli'),gx-215,gy-215,gr,gs,go);
 $('speed').style.opacity=t>=3.45&&t<3.92?.7:0;
 let impact=t>=2.16&&t<2.29?'small':t>=4.0&&t<4.16?'big':null;
 pose($('flash'),impact==='small'?275:900,impact==='small'?245:444,impact==='small'?-12:15,impact==='small'?.52:1,impact?1:0);
 $('seek').value=t;$('time').textContent=`${t.toFixed(2)} / 5.60`;
 window.currentTime=t;return {time:t,cookieTransform:$('cookie').style.transform||'none',smallHit:t>=2.16,bigHit:t>=4.0,crying};
}
window.renderAt=renderAt;
const fit=()=>$('stage').style.transform=`scale($('viewport').clientWidth/1280)`;
if(new URLSearchParams(location.search).has('capture'))document.body.classList.add('capture');new ResizeObserver(fit).observe($('viewport'));fit();
let playing=false,started=0;function tick(now){if(!playing)return;let t=(now-started)/1000;renderAt({time:t});if(t<5.6)requestAnimationFrame(tick);else{playing=false;$('play').textContent='再看一次'}}
$('play').onclick=()=>{if(playing){playing=false;$('play').textContent='播放开头';return}playing=true;started=performance.now();$('play').textContent='暂停';requestAnimationFrame(tick)};$('seek').oninput=()=>{playing=false;$('play').textContent='播放开头';renderAt({time:Number($('seek').value)})};
renderAt({time:0});
</script>
