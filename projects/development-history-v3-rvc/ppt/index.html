:root{--bg:#07141d;--ink:#eaf5f1;--muted:#94b5b6;--cyan:#63e4cf;--gold:#f5c27b;--pink:#ff7f96;--line:#31515b}*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}#deck{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--scale,1));background:radial-gradient(ellipse at 77% 45%,#16424a55,transparent 55%),var(--bg);overflow:hidden}header{position:absolute;top:54px;left:88px;right:88px;display:flex;justify-content:space-between;font-size:18px;letter-spacing:3px;color:#70999d}header b{font-weight:500;color:#eaf5f1}.slide{display:none;position:absolute;inset:0;padding:170px 88px 150px;grid-template-columns:720px 1fr;gap:90px;align-items:center}.slide.active{display:grid}.eyebrow{font-size:19px;color:var(--cyan);letter-spacing:4px;margin-bottom:24px}.counter{font:18px Consolas;color:#648990;margin-top:35px}h1{font-size:70px;line-height:1.16;letter-spacing:-3px;margin:0 0 30px;max-width:700px}h1 em{font-style:normal;color:var(--cyan)}p{font-size:27px;line-height:1.85;color:var(--muted);margin:0;max-width:700px}.source{margin-top:30px;color:#65898f;font-size:17px;line-height:1.75}.source strong{color:var(--gold);font-weight:500}.stage{height:600px;position:relative;display:flex;align-items:center;justify-content:center}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#63e4cf08 48%,transparent)}.axis{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}.packet{position:absolute;left:calc(var(--p)*1%);top:calc(50% + var(--y));width:126px;height:42px;border:1px solid #568b91;border-radius:9px;background:#102b34;display:grid;place-items:center;font-size:16px;color:#cde0dc;transform:translate(-50%,-50%) scale(var(--s,1));opacity:var(--o,1)}.packet.hot{border-color:var(--gold);color:var(--gold)}.packet.merge{width:180px;border-color:var(--cyan);color:var(--cyan)}.context-box{position:absolute;left:8%;right:8%;top:28%;height:205px;border:1px solid #517a80;border-radius:18px;padding:24px}.context-box .bar{height:22px;border-radius:20px;background:#1d3d45;overflow:hidden}.context-box .fill{width:calc(var(--p)*1%);height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));transform-origin:left}.context-box .limit{position:absolute;top:70px;bottom:22px;left:calc(var(--limit)*1%);border-left:2px dashed var(--pink)}.context-box label{display:flex;justify-content:space-between;color:var(--muted);font-size:18px;margin-bottom:24px}.overflow{position:absolute;right:45px;bottom:34px;color:var(--pink);font-size:21px;opacity:var(--overflow,0)}.tokens{position:absolute;left:4%;right:4%;bottom:90px;display:flex;gap:10px;justify-content:center}.token{padding:14px 18px;border:1px solid #3c6167;border-radius:8px;font-size:18px;opacity:.6;transform:translateY(0)}.token.selected{border-color:var(--cyan);color:var(--cyan);opacity:1;transform:translateY(-12px)}.window{position:absolute;left:10%;right:10%;top:21%;bottom:21%;border:1px solid var(--cyan);border-radius:22px;padding:34px;transform:scaleX(var(--wide,.45));transform-origin:left;overflow:hidden;background:#0b2730aa}.window .evidence{display:flex;flex-direction:column;gap:15px;width:680px;opacity:var(--evidence,0)}.evidence i{height:14px;background:#3e7277;border-radius:7px}.evidence i:nth-child(2){width:75%}.evidence i:nth-child(3){width:90%}.evidence i:nth-child(4){width:58%}.evidence i:nth-child(5){width:82%}.full-badge{position:absolute;right:35px;top:35px;color:var(--gold);font-size:21px;opacity:var(--full,0)}.badprompt,.goodprompt{position:absolute;left:8%;right:8%;border:1px solid #515f63;border-radius:14px;padding:24px;font-size:22px;line-height:1.6}.badprompt{top:20%;color:#b7a6a8;opacity:calc(1 - var(--p))}.goodprompt{top:51%;border-color:var(--cyan);clip-path:inset(0 calc(100% - var(--good,0)*1%) 0 0);color:var(--cyan)}.rule{position:absolute;bottom:20%;display:flex;gap:16px}.rule b{border:1px solid #4e777a;border-radius:20px;padding:10px 18px;color:var(--muted);opacity:.25}.rule b.on{opacity:1;border-color:var(--cyan);color:var(--cyan)}.script-track{position:absolute;left:7%;right:7%;top:47%;height:5px;background:var(--line)}.script-dot{position:absolute;left:calc(var(--p)*80% + 10%);top:calc(47% - 13px);width:30px;height:30px;border-radius:50%;background:var(--gold);box-shadow:0 0 35px var(--gold);transform:translateX(-50%)}.script-node{position:absolute;top:32%;padding:22px;border:1px solid #446e73;border-radius:12px;color:var(--muted);opacity:.35;transform:translateY(20px)}.script-node.on{opacity:1;transform:translateY(0);border-color:var(--cyan);color:var(--ink)}.script-node:nth-child(1){left:5%}.script-node:nth-child(2){left:34%}.script-node:nth-child(3){right:5%}.model-line{position:absolute;left:10%;right:10%;top:56%;height:3px;background:var(--line)}.model-marker{position:absolute;left:calc(10% + var(--p)*80%);top:calc(56% - 18px);width:38px;height:38px;border-radius:50%;background:var(--cyan);box-shadow:0 0 40px var(--cyan);transform:translateX(-50%)}.model-labels{position:absolute;left:8%;right:8%;top:63%;display:flex;justify-content:space-between;color:var(--muted);font-size:21px}.glyphs{position:absolute;top:25%;display:flex;gap:24px;font-size:42px;color:var(--cyan)}.glyphs span{opacity:var(--glyph,.2);transform:translateY(calc((1 - var(--glyph))*20px))}.fourgrid{position:absolute;left:8%;top:20%;width:430px;height:430px;display:grid;grid-template-columns:1fr 1fr;gap:8px;transform:translateX(calc(var(--p)*-100px)) rotate(calc(var(--p)*-3deg));opacity:calc(1 - var(--p)*.7)}.fourgrid i{background:#16444b;border:1px solid #4a7d7d;display:grid;place-items:center;color:#87c1bc;font-style:normal;font-size:19px}.film{position:absolute;right:7%;top:20%;width:470px;height:440px;border:1px solid var(--cyan);background:linear-gradient(145deg,#112d34,#081921);transform:translateX(calc((1 - var(--p))*140px));opacity:var(--film,0);padding:28px}.film:before{content:"";display:block;height:240px;background:radial-gradient(circle at 60% 35%,#6ee7d65a,transparent 20%),linear-gradient(135deg,#184d55,#0b222a);border:1px solid #4e7e83}.film span{display:block;color:var(--gold);margin-top:22px;font-size:22px}.anchor{position:absolute;left:52%;top:48%;color:var(--cyan);font-size:18px;opacity:var(--anchor,0)}.nodes{position:absolute;inset:12% 8%}.node{position:absolute;width:128px;height:70px;border:1px solid #4f7c80;border-radius:12px;display:grid;place-items:center;color:var(--muted);opacity:.5}.node.sui{left:7%;top:15%}.node.guest{right:7%;top:15%}.node.voice{left:38%;bottom:8%}.node.image{right:8%;bottom:5%}.node.on{border-color:var(--cyan);color:var(--cyan);opacity:1}.link{position:absolute;height:2px;background:var(--cyan);transform-origin:left;opacity:var(--link-o,0)}.link.one{left:23%;top:28%;width:42%;transform:rotate(20deg)}.link.two{left:50%;top:34%;width:36%;transform:rotate(65deg)}.clock{position:absolute;left:17%;top:18%;width:250px;height:250px;border:2px solid #4b747b;border-radius:50%;display:grid;place-items:center;font-size:42px;color:var(--gold)}.clock:after{content:"";position:absolute;left:50%;top:50%;height:82px;width:3px;background:var(--cyan);transform-origin:bottom;transform:translate(-50%,-100%) rotate(calc(var(--p)*720deg))}.path{position:absolute;left:48%;right:8%;top:31%;font-size:22px;color:var(--muted);line-height:3}.path b{color:var(--cyan);font-weight:500}.branch{position:absolute;left:50%;top:53%;width:42%;height:2px;background:var(--line)}.branch:after{content:"";position:absolute;right:0;top:-22px;width:70%;height:44px;border-top:2px solid var(--cyan);border-right:2px solid var(--cyan);border-radius:0 28px 0 0;opacity:var(--p)}.branch:before{content:"文字先发 → 图片补图";position:absolute;right:0;top:34px;color:var(--gold);font-size:19px;opacity:var(--p)}.queue{position:absolute;left:7%;right:7%;top:34%;display:flex;justify-content:space-between}.qitem{width:170px;height:95px;border:1px solid #426d72;border-radius:10px;display:grid;place-items:center;color:var(--muted);opacity:.5}.qitem.on{color:var(--cyan);border-color:var(--cyan);opacity:1;transform:translateY(-12px)}.qarrow{align-self:center;color:var(--gold);font-size:30px}.end-ring{width:430px;height:430px;border-radius:50%;border:1px solid var(--cyan);display:grid;place-items:center;color:var(--cyan);font-size:48px;box-shadow:0 0 0 38px #63e4cf08,0 0 100px #63e4cf18}.end-ring small{display:block;font-size:19px;color:var(--muted);text-align:center;margin-top:15px}footer{position:absolute;left:88px;right:88px;bottom:112px;display:flex;align-items:center;gap:22px;color:#72979c;font-size:17px}.rail{flex:1;display:flex;gap:8px}.rail i{height:3px;flex:1;background:#284750}.rail i.on{background:var(--cyan)}.rail i.past{background:#387177}.page{font:19px Consolas;color:var(--muted)}
</style></head><body><main id="deck"><header><b>鹿饼暖心回复发展史 · V2</b><span>从“一句晚安”到一条可靠的内容流水线</span></header></main><script>
const data=[{"id":"intro","title":"为什么一条晚安，要做成一条流水线？","narration":"你看到的可能只是一条晚安，但它背后要先回答四个问题：直播发生了什么，主播说了什么，哪些内容值得记住，以及什么时候发出去。这期先看完整流程，再拆开那些真正费心的改动。","lede":"先看观众会得到什么：一条晚安背后的完整工作流。","kind":"intro","labels":["本期主题","整体流程","优化细节"]},{"id":"overview","title":"先看地图：录播结束以后发生什么？","narration":"录播姬把分段文件和弹幕保存下来，Webhook 告诉程序“这一场可能结束了”。程序确认文件稳定、合并录播、提取音频，再交给字幕和上下文流程。最后，晚安回复、漫画、梗概和自动切片各走自己的输出路径，并保留人工确认。","lede":"从录播姬到 Webhook，再到四种输出。","kind":"overview","labels":["录播姬","Webhook","ASR → 晚安 → 切片"]},{"id":"origin","title":"输入从哪里来：不是凭空问 AI","narration":"第一步不是让模型猜。MikuFans 录播姬负责录视频和弹幕，Webhook 负责触发；程序还要等文件写完、处理重连和多段录播。输入不可靠，后面的 AI 再聪明也只是对着半场直播做总结。","lede":"输入不是猜出来的，是录播、弹幕和文件状态。","kind":"flow","labels":["人工整理","GPT 网页","晚安草稿"]},{"id":"context_limit","title":"先让电脑听懂：Whisper 到 FunASR","narration":"早期我们接的是 Whisper，把直播声音转成字幕。后来逐步接入 FunASR、Paraformer、SenseVoice 等现成工具，获得 VAD、标点、热词和更适合中文的时间戳。我们是在接工具和处理边界，不是在重新发明 ASR。","lede":"早期先解决：模型到底能看到什么。","kind":"context","labels":["原始弹幕","有限窗口","超出容量"]},{"id":"short_context","title":"说话人区分，解决了一半的问题","narration":"说话人识别可以帮助区分主播和联动嘉宾，但它不是魔法：声纹相近、多人同时说话、样本不足时仍会错。我们做过参考音频、聚类和相似度诊断，最终选择按房间和任务灰度开启，而不是假装每次都分得准。","lede":"筛选不是删字，是保留信号。","kind":"selection","labels":["随机丢弃","目标 1000 行","必留细节"]},{"id":"full_context","title":"一场直播，最后会分成四种结果","narration":"字幕和弹幕进入上下文后，会分成四条路：晚安回复回答“怎么回应主播”，漫画把事件变成画面，梗概帮助人快速浏览，切片则用高光和字幕寻找可以剪出的片段。它们共享证据，但不是同一份 Prompt。","lede":"模型变强后，再把全文放回来。","kind":"expand","labels":["筛选输入","完整证据","原文复核"]},{"id":"warm_prompt","title":"上下文装不下时，先做取舍","narration":"早期模型装不下整场直播。我们按时间分组、合并复读、降低低信息内容权重，把随机丢弃改成评分、目标行数和必留项。短上下文不是偷懒，而是当时为了让模型抓住重点的工程选择。","lede":"暖心来自具体细节，不是形容词。","kind":"prompt","labels":["泛泛夸奖","回应原话","具体 → 感受"]},{"id":"prompt_boundaries","title":"模型变强以后，才敢试全量","narration":"后来模型和缓存能力进步，部分直播间开始灰度实验新版本：保留完整字幕和弹幕，只压缩重复排版，再用原文复核。短上下文是早期选择，全量上下文是更强模型下的新选择，不能把一种策略永远套给所有房间。","lede":"称呼、说话人、时段，都有边界。","kind":"rules","labels":["称呼边界","说话人边界","真实时段"]},{"id":"comic_script","title":"晚安 Prompt：不要泛泛地夸","narration":"回复一度爱说“含金量爆表”，听起来热闹，却每晚都差不多。后来 Prompt 要求回应本场原话、失误、生活细节和观众反应；称呼、字数、时段和最小长度也都要检查。暖心不是加形容词，而是具体地回应今晚。","lede":"先写节拍，再决定画什么。","kind":"script","labels":["原文证据","叙事节拍","画面脚本"]},{"id":"references","title":"漫画输入：先写脚本，再选证据","narration":"漫画不是把摘要交给画图模型。先把事件拆成起因、转折和结果，再决定哪个人物、道具或游戏画面需要参考图。立绘负责“画得像”，录播截图负责“这场真的发生过”。","lede":"立绘核对人物，截图核对本场。","kind":"references","labels":["角色立绘","关键截图","核对事实"]},{"id":"wrong_game","title":"模型会犯一种很像人的错误","narration":"我们遇到过小弥的图总在启动原神。不是模型不认识人物，而是稳定人设压过了本场事实。后来明确优先级：标题和原话优先，截图核对作品；表情包名字也不能凭空变成联动嘉宾。","lede":"人设不能盖过本场事实。","kind":"evidence","labels":["稳定人设","本场标题","实际游戏"]},{"id":"image_models","title":"图片模型进步，文字策略也会变","narration":"早期图片里的中文经常出错，所以 Prompt 要求少字甚至纯默剧。后来接入更支持中文的模型，才开始规划四到六处回忆锚点，让短台词、拟声词和标题字真正服务画面，而不是盖住人物。","lede":"模型能否写中文，决定画面字怎么做。","kind":"models","labels":["早期模型","高级模型","中文锚点"]},{"id":"composition","title":"四格和沉浸式，各自解决一种问题","narration":"四格适合并列讲清几个笑点；沉浸式适合把一个事件做成电影感主画面。我们还规定文字锚点要贴着对应动作，避免把整段直播摘要缩成一张大海报。","lede":"四格讲顺序，沉浸式讲现场。","kind":"composition","labels":["四格分镜","沉浸主画面","回忆锚点"]},{"id":"multi_people","title":"从岁己单人，到多人联动","narration":"扩展到多个主播后，每个房间都要有自己的称呼、粉丝名、外观、参考图和字数习惯。提到别人时，系统还要判断是不是确实出现了这个人，不能把所有主播套成岁己的模板。","lede":"每个房间都有自己的配置。","kind":"identity","labels":["房间配置","独立称呼","参考图"]},{"id":"false_guests","title":"声音、名字和上下文要互相核对","narration":"短名字可能是别名，也可能只是弹幕表情包；ASR 还会把同音词听错。我们增加反例和后处理，宁可保留匿名说话人，也不把一个词直接替换成错误的人名。","lede":"提到名字，不代表真的联动。","kind":"gate","labels":["提到名字","证据门槛","允许入画"]},{"id":"timing","title":"什么时候发，也是一部分产品设计","narration":"断流不等于下播，文件完成也不等于最新动态已经确认。新动态窗口内优先抢时效；图片没好就先发文字，错过窗口再有限等待、补图。晚安不是生成完就立刻发送。","lede":"生成完成，不等于马上发送。","kind":"timing","labels":["确认动态","五分钟窗口","文字先发"]},{"id":"reliability","title":"观众看不到的，是排队和恢复","narration":"显卡忙时 ASR 要排队，重启后任务要恢复，同一场不能重复生图或重复评论。缓存减少重复输入，失败的切片不能拖垮晚安主流程；这些才是从脚本变成服务的部分。","lede":"队列、缓存、恢复，决定能不能长期跑。","kind":"queue","labels":["排队恢复","缓存命中","一次发送"]},{"id":"ending","title":"所以，这不是“一个模型一键做视频”","narration":"它是一条由录播姬、Webhook、FFmpeg、Whisper、FunASR、多个 AI 模型和人工审核接起来的流水线。模型会换，Prompt 会改，但目标不变：把看直播的人想说的话，准确、及时、温柔地送达。","lede":"把工具接起来，才能持续交付心意。","kind":"ending","labels":["713 次提交","事实更准","心意送达"]}];const deck=document.querySelector('#deck');const slides=[];const rail=document.createElement('div');rail.className='rail';let current=0;
function visual(item){const labels=item.labels.map(function(x,i){return '<span class="token '+(i===0?'selected':'')+'" style="--dy:'+(i*3)+'px">'+x+'</span>'}).join('');if(item.kind==='flow')return '<div class="axis"></div>'+['弹幕','时间','情绪','原话'].map(function(x,i){return '<i class="packet '+(i===3?'hot':'')+'" style="--p:'+(12+i*22)+';--y:'+((i-1.5)*75)+'px">'+x+'</i>'}).join('')+'<div class="packet merge" style="--p:50;--y:0">可用输入</div>';if(item.kind==='context')return '<div class="context-box" style="--limit:68"><label><span>原始直播证据</span><span>上下文窗口</span></label><div class="bar"><div class="fill"></div></div><div class="limit"></div><div class="overflow">超出窗口 → 必须取舍</div></div>';if(item.kind==='selection')return '<div class="context-box" style="--limit:100"><label><span>评分：信号、次数、人数</span><span>目标行数</span></label><div class="bar"><div class="fill"></div></div><div class="tokens">'+labels+'</div></div>';if(item.kind==='expand')return '<div class="window"><div class="evidence"><i></i><i></i><i></i><i></i><i></i></div><div class="full-badge">完整证据 · 重复压缩</div></div>';if(item.kind==='prompt')return '<div class="badprompt">“今晚含金量爆表，大家都很开心。”<br><small>泛泛、每晚都能用</small></div><div class="goodprompt">“从本场那句原话切入，再说为什么让人心疼或发笑。”</div><div class="rule">'+labels+'</div>';if(item.kind==='rules')return '<div class="rule" style="top:35%;bottom:auto">'+labels+'</div><div class="nodes"><div class="node sui on">房主岁己</div><div class="node guest">嘉宾／外部声源</div><div class="node voice on">时段与称呼</div></div>';if(item.kind==='script')return '<div class="script-node">原文证据</div><div class="script-node">叙事节拍</div><div class="script-node">角色动作</div><div class="script-track"></div><div class="script-dot"></div>';if(item.kind==='references')return '<div class="nodes"><div class="node sui on">立绘：人物</div><div class="node guest on">截图：事实</div><div class="node voice">脚本：动作</div><div class="node image">成图：证据</div><div class="link one"></div><div class="link two"></div></div>';if(item.kind==='evidence')re
