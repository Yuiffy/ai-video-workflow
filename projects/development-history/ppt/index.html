<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鹿饼暖心回复发展史</title>
<style>
:root{--ink:#e8f1ef;--muted:#aec2c0;--deep:#071a25;--teal:#0c6670;--coral:#ef8065;--gold:#e6bd72}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:var(--deep);color:var(--ink);font-family:Georgia,"Noto Serif SC",serif}main{width:100vw;height:100vh;position:relative;background:radial-gradient(circle at 76% 48%,#14515c 0,#0d2935 38%,#071a25 78%)}.slide{position:absolute;inset:0;padding:8vh 9vw;display:grid;grid-template-columns:1.08fr .92fr;align-items:center;opacity:0;transform:translateY(24px) scale(.985);transition:opacity .7s ease,transform .7s ease}.slide.active{opacity:1;transform:none}.copy{max-width:720px}.kicker{color:var(--coral);letter-spacing:.16em;font:600 14px/1.4 ui-sans-serif,system-ui}.count{color:#7d9b9a;font:13px ui-sans-serif,system-ui;margin-bottom:16px}h1,h2{font-size:clamp(44px,5.3vw,88px);line-height:1.02;letter-spacing:-.055em;margin:12px 0 22px}p{max-width:630px;color:var(--muted);font:400 clamp(18px,1.48vw,28px)/1.72 ui-sans-serif,system-ui}.art{height:68vh;position:relative;display:grid;place-items:center}.halo{width:min(34vw,520px);aspect-ratio:1;border:1px solid #6ed3d055;border-radius:50%;box-shadow:0 0 0 34px #6ed3d00b,0 0 100px #6ed3d033;animation:spin 24s linear infinite}.halo:before,.halo:after{content:"";position:absolute;left:50%;top:50%;width:58%;height:1px;background:var(--gold);transform:translate(-50%,-50%) rotate(27deg)}.halo:after{background:var(--coral);transform:translate(-50%,-50%) rotate(-27deg);width:82%}.sigil{position:absolute;width:116px;height:116px;border-radius:30% 70% 55% 45%;background:linear-gradient(145deg,#f5d48e,#d97058 58%,#0d6670);transform:rotate(-14deg);box-shadow:20px 22px 0 #0004;animation:float 5s ease-in-out infinite}.sigil:after{content:"岁己";position:absolute;inset:0;display:grid;place-items:center;color:#fff4d8;font-size:30px;transform:rotate(14deg)}.node{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--coral);box-shadow:0 0 25px var(--coral);animation:pulse 2.2s ease-in-out infinite}.n1{left:21%;top:25%}.n2{right:20%;top:32%;background:var(--gold)}.n3{right:24%;bottom:22%;background:#75d1cb}.rail{position:absolute;left:9vw;right:9vw;bottom:5vh;display:flex;gap:8px}.dot{height:4px;flex:1;background:#38535b}.dot.active{background:var(--coral)}.stamp{position:absolute;right:4vw;top:5vh;writing-mode:vertical-rl;color:#73918f;letter-spacing:.2em;font:12px ui-sans-serif,system-ui}@keyframes float{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(-7deg) translateY(-16px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.5);opacity:1}}@media(max-width:800px){.slide{grid-template-columns:1fr;padding:8vh 8vw}.art{height:26vh}.halo{width:42vw}h1,h2{font-size:14vw}p{font-size:16px}}
</style></head><body><main id="deck"><div class="stamp">DANMAKU → ASR → AI → VIDEO</div></main>
<script>
const data=[
['01 · 起点','本来只想偷懒写一句晚安','这个项目最初没有宏大目标。我只是想给虚拟主播岁己回一条更像样的晚安，于是打开 GPT 网页，把想说的话交给它。'],
['02 · 真正的需求','一条晚安，不只是晚安','我们想知道今天播了什么、发生了什么梗，也想让回复里有一点真的在场感，温柔但不油腻。'],
['03 · 手工阶段','AI 没看直播，它在考古弹幕','把弹幕聊天记录复制给 GPT。AI 没有听过主播原话，只能从观众的哈哈哈和问号里，努力考古今晚到底发生了什么。'],
['04 · 第一次写代码','先别急着问 AI，先帮它划重点','按时间分组，合并重复刷屏，压掉水弹幕，先把原始 XML 变成 AI 看得懂的重点。'],
['05 · ASR','从看弹幕猜，升级到直接听直播','声音变成波形，波形再变成带时间轴的字幕，主播真正说过的话终于回来了。'],
['06 · 高光提取','字幕给内容，弹幕给重点','字幕告诉我们主播说了什么，弹幕热度告诉我们观众在哪里沸腾，两条轨道圈出真正值得看的瞬间。'],
['07 · 自动化','录播结束后，软件会来敲门','Webhook 像一封敲门的信：文件好了，可以开工了。它触发合并分段、提取音频、转字幕和后面的所有步骤。'],
['08 · 小工厂','它终于变成一条 AI 小工厂','录播结束，自动字幕，弹幕找重点，AI 写晚安，AI 画漫画，再把结果送进 B 站评论。'],
['09 · 继续长大','从晚安回复，继续长成自动切片','ASR 让字幕更稳；高光召回、自动切片、烧录字幕和封面，让长直播也能变成短片，但最后一眼仍留给人工审核。'],
['10 · 结论','AI 不是魔法，真正厉害的是把工具接起来','把录播姬、FFmpeg、ASR、AI API 和 B 站接口一件件接起来，帮我们把心意稳定送达。']
];
const deck=document.querySelector('#deck');let current=0;data.forEach((s,i)=>{const el=document.createElement('section');el.className='slide'+(i===0?' active':'');el.dataset.slide=i+1;el.innerHTML=`<div class="copy"><div class="kicker">${s[0]}</div><div class="count">鹿饼暖心回复发展史 / ${String(i+1).padStart(2,'0')} / 10</div><h1>${s[1]}</h1><p>${s[2]}</p></div><div class="art"><i class="halo"></i><i class="sigil"></i><i class="node n1"></i><i class="node n2"></i><i class="node n3"></i></div>`;deck.appendChild(el)});const rail=document.createElement('nav');rail.className='rail';rail.innerHTML=data.map((_,i)=>`<i class="dot${i===0?' active':''}"></i>`).join('');deck.appendChild(rail);const slides=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('.dot')];function show(n){current=(n+slides.length)%slides.length;slides.forEach((s,i)=>s.classList.toggle('active',i===current));dots.forEach((d,i)=>d.classList.toggle('active',i===current))}window.startRecording=()=>setInterval(()=>show(current+1),7000);window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(current+1);if(e.key==='ArrowLeft')show(current-1)});
</script></body></html>
